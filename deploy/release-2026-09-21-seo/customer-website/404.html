<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Ali's Barber Shop</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#1a1a1a" />
    <!--
      Served by Apache's ErrorDocument with a real HTTP 404 status.

      Deliberately a hand-written static page rather than a React route: an error
      page has to work when the JS bundle is the thing that's broken, and it must
      never depend on a chunk load or an API call. No scripts, no external CSS,
      no fetches.
    -->
    <style>
      :root {
        --primary: hsl(0 0% 10%);
        --primary-foreground: hsl(60 7% 97%);
        --accent: hsl(40 45% 56%);
        --accent-foreground: hsl(0 0% 10%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .code {
        font-size: clamp(4rem, 18vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.03em;
        margin: 0;
        color: var(--accent);
      }
      h1 {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 16px 0 0;
      }
      p { color: rgba(250, 250, 245, 0.6); margin: 12px 0 0; line-height: 1.6; }
      nav { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 14px 24px;
        background: var(--accent);
        color: var(--accent-foreground);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      a.ghost {
        background: transparent;
        color: var(--primary-foreground);
        border: 1px solid rgba(250, 250, 245, 0.25);
      }
      a.btn:hover { opacity: 0.9; }
      .details { margin-top: 40px; font-size: 0.85rem; color: rgba(250, 250, 245, 0.45); }
      .details a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn't exist</h1>
      <p>
        The link may be out of date, or the address mistyped.<br />
        The shop is still very much open.
      </p>
      <nav>
        <a class="btn" href="/#booking">Book an appointment</a>
        <a class="btn ghost" href="/">Go to the homepage</a>
      </nav>
      <p class="details">
        Ali's Barber Shop · 4201 62nd North Unit 9, Pinellas Park, FL 33781 ·
        <a href="tel:+18138959229">813-895-9229</a>
      </p>
    </main>
  </body>
</html>
