<!doctype html>
<html lang="en">
  <head>
    <!-- Load GTM after the initial render, or immediately on first interaction. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d) {
        var loaded = false;
        var events = ["pointerdown", "keydown", "touchstart", "scroll"];

        function loadGtm() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (eventName) {
            w.removeEventListener(eventName, loadGtm);
          });
          w.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
          var script = d.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtm.js?id=GTM-N5G6ZXP2";
          d.head.appendChild(script);
        }

        events.forEach(function (eventName) {
          w.addEventListener(eventName, loadGtm, { once: true, passive: true });
        });

        w.addEventListener("load", function () {
          if ("requestIdleCallback" in w) {
            w.requestIdleCallback(loadGtm, { timeout: 3000 });
          } else {
            w.setTimeout(loadGtm, 2000);
          }
        }, { once: true });
      })(window, document);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Everything route-specific — title, description, canonical, OG/Twitter
      cards, per-page preloads and JSON-LD — is injected here at build time by
      scripts/prerender.mjs from the meta in src/routes.tsx.

      It used to be hardcoded in this file, which is why there could only ever be
      one page: a second URL would have inherited the homepage's title, canonical
      and structured data. In dev this comment is inert, so `npm run dev` shows
      no title — that is expected and only affects the dev server.
    -->
    <!--@seo-head-->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ali's Barber" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://api.alisbarbershop.com" crossorigin="anonymous">
    <link rel="dns-prefetch" href="https://api.alisbarbershop.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
</head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N5G6ZXP2"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
